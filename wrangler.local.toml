# Local-only D1. Do not use this configuration for deployment.
name = "bldnex-contact-local"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-05"

[vars]
CONTACT_ENABLED = "false"
CONTACT_ORIGIN = "http://localhost:8788"

[[d1_databases]]
binding = "CONTACT_DB"
database_name = "bldnex-contact-local"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"
